<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow caixa-cadastro">

        <div class="card-body p-5">

            <h2 class="titulo text-center mb-4">
                🌸 Criar Conta
            </h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" placeholder="Digite seu nome">
                </div>

                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <input type="text" class="form-control" placeholder="Escolha um usuário">
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" placeholder="Digite seu e-mail">
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control" placeholder="Crie uma senha">
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirmar Senha</label>
                    <input type="password" class="form-control" placeholder="Repita a senha">
                </div>

                <div class="d-grid gap-2">

                    <button class="btn btn-rosa">
                        Cadastrar
                    </button>

                    <a href="index.html" class="btn btn-outline-secondary">
                        Voltar para o Login
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
