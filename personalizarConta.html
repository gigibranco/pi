<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Florescer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark cor-principal shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold" href="menuPrincipal.html">
            🌸 Florescer
        </a>

        <a href="telaPrincipal.html" class="btn btn-light btn-sm">
            Voltar
        </a>

    </div>

</nav>

<div class="container py-5">

    <div class="card shadow caixa-perfil mx-auto">

        <div class="card-body p-5">

            <h2 class="titulo text-center mb-4">
                👤 Meu Perfil
            </h2>

            <div class="text-center mb-4">

                <img src="https://via.placeholder.com/120"
                     class="rounded-circle border border-3 border-light shadow"
                     alt="Foto do usuário">

                <div class="mt-3">
                    <button class="btn btn-outline-secondary btn-sm">
                        Alterar Foto
                    </button>
                </div>

            </div>

            <form>

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" value="Nome do Usuário">
                </div>

                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <input type="text" class="form-control" value="usuario123">
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" value="usuario@email.com">
                </div>

                <div class="mb-3">
                    <label class="form-label">Nova Senha</label>
                    <input type="password" class="form-control" placeholder="Digite uma nova senha">
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirmar Senha</label>
                    <input type="password" class="form-control" placeholder="Confirme a senha">
                </div>

                <div class="d-grid gap-2">

                    <button class="btn btn-rosa">
                        Salvar Alterações
                    </button>

                    <button class="btn btn-outline-danger">
                        Excluir Conta
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
