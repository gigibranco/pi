
services:
  web:
    build: .
    container_name: florescer_php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: florescer_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: florescer
      MYSQL_USER: florescer_user
      MYSQL_PASSWORD: florescer123
    ports:
      - "3307:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s


volumes:
  dados_mysql:
